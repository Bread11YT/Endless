<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Бесконечный тракт — Tower Defense</title>
<style>
:root{--bg:#f1efe6;--panel:#e2dfd0;--ink:#25302a;--mute:#6b7468;--accent:#2f7d4f;--bad:#b4402f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c211d;--panel:#2a312b;--ink:#e6e8df;--mute:#99a395;--accent:#6cc48b;--bad:#e5705d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c211d;--panel:#2a312b;--ink:#e6e8df;--mute:#99a395;--accent:#6cc48b;--bad:#e5705d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px}
#top{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;font-weight:bold}
#top span{background:var(--panel);padding:4px 12px;border-radius:6px}
#wrap{position:relative;width:100%;max-width:768px}
canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:none;background:#3d5a3a}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;font-size:22px;font-weight:bold}
#bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:768px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid transparent;border-radius:6px;padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.sel{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button.go{background:var(--accent);color:#fff}
#info{min-height:44px;width:100%;max-width:768px;background:var(--panel);border-radius:6px;padding:6px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mute)}
#tree{position:absolute;inset:0;display:none;overflow:auto;background:var(--bg);color:var(--ink);border-radius:8px;padding:10px;z-index:5}
#tree .th{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc>div{display:flex;flex-direction:column;gap:6px}
.node{text-align:left;font-size:13px}
.node.own{border-color:var(--accent)}
@media(max-width:560px){.tc{grid-template-columns:1fr}}
body{background:radial-gradient(ellipse at top,var(--panel),var(--bg) 70%)}
#top span{box-shadow:0 2px 0 rgba(0,0,0,.18);font-size:16px;padding:5px 14px;border-radius:999px}
canvas{box-shadow:0 0 0 3px #2a2218,0 10px 28px rgba(0,0,0,.35)}
button{transition:transform .08s,border-color .15s,background .15s;box-shadow:0 2px 0 rgba(0,0,0,.2)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
#bar button[data-t]{border-bottom-width:4px;font-weight:bold}
#over{backdrop-filter:blur(3px);font-size:30px}
#top span{background:linear-gradient(var(--panel),color-mix(in srgb,var(--panel) 82%,#000))}
#top span.hurt{animation:hurt .5s}
#top span.up{animation:pop .3s}
@keyframes hurt{20%{transform:translateX(-4px) scale(1.08);color:var(--bad)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}}
@keyframes pop{50%{transform:scale(1.12)}}
#over{background:radial-gradient(circle,rgba(50,0,0,.5),rgba(0,0,0,.85))}
#overT{font-size:42px;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 26px var(--bad)}
#over button{font-size:18px;padding:10px 22px}
#info{border-left:4px solid var(--accent)}
#bar button[data-t]:not(:disabled):hover{transform:translateY(-2px)}
#bar button.go:not(:disabled){animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 18px var(--accent)}}
@media(prefers-reduced-motion:reduce){button{transition:none}#bar button.go,#top span{animation:none!important}}
#invh{width:100%;max-width:768px;display:flex;justify-content:space-between;color:var(--mute);font-size:13px;font-weight:bold;padding:0 4px}
#inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;max-width:768px}
#inv button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-bottom-width:4px;min-height:68px;line-height:1.2}
#inv .ic{font-size:24px}#inv .nm{font-size:12px;font-weight:bold}#inv .cnt{font-size:13px;color:var(--mute)}
#inv button.empty{opacity:.45}
#inv button.sel{background:color-mix(in srgb,var(--accent) 18%,var(--panel));transform:translateY(-3px)}
#inv kbd{position:absolute;top:3px;left:5px;font:10px monospace;color:var(--mute)}
@media(hover:none){#inv kbd{display:none}}
#bar button{flex:1 1 auto}
#next{order:-1;flex:2 1 100%!important;font-size:17px;font-weight:bold;padding:10px}
#mapt{width:100%;max-width:768px}#mapt summary{cursor:pointer;color:var(--mute);padding:4px}
#tools{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
#info button{padding:8px 14px;font-weight:bold}
@media(pointer:coarse){button{min-height:44px}}
/* ===== v4: карта на весь экран, управление поверх ===== */
:root{padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:block;padding:0;gap:0;background:radial-gradient(ellipse at center,#243424,#0c120c);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
#wrap{position:fixed;inset:0;width:auto;max-width:none;display:grid;place-items:center}
canvas{border-radius:0;box-shadow:0 0 40px rgba(0,0,0,.6)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:calc(env(safe-area-inset-left,0px) + 8px);z-index:3;display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-start;pointer-events:none}
#top span{font-size:14px;padding:4px 10px;background:rgba(18,24,18,.78);color:#f1efe6;box-shadow:none;backdrop-filter:blur(4px)}
#tr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);z-index:3;display:flex;gap:6px}
#bar{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);right:calc(env(safe-area-inset-right,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:3;width:auto;max-width:none;display:flex;flex-wrap:nowrap;justify-content:flex-start;gap:6px;pointer-events:none}
#bar button,#tr button,#tools button{pointer-events:auto;flex:0 0 auto;background:rgba(18,24,18,.82);color:#f1efe6;border:2px solid rgba(255,255,255,.2);min-width:46px;min-height:46px;font-size:20px;padding:4px 10px;backdrop-filter:blur(4px)}
#bar button.sel,#tools button.sel{border-color:var(--accent)}
#bar #next{margin-left:auto;order:0;flex:0 0 auto!important;font-size:17px;padding:8px 18px;background:var(--accent);color:#fff;border-color:rgba(255,255,255,.35)}
#invBtn{position:relative}
.bdg{position:absolute;top:-7px;right:-7px;background:var(--accent);color:#fff;font:bold 11px/1 sans-serif;border-radius:999px;padding:3px 6px}
#tools{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:3;display:none;flex-direction:column;gap:6px;pointer-events:none}
#tools.open{display:flex}
#tools button{font-size:14px;text-align:left}
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);width:min(560px,calc(100% - 16px));z-index:4;display:none;background:rgba(14,20,14,.94);color:#f1efe6;border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;backdrop-filter:blur(6px)}
body.sheet #sheet{display:block}
body.sheet #info{display:none}
#invh{display:flex;gap:8px;align-items:center;width:auto;max-width:none;margin-bottom:6px;color:rgba(255,255,255,.7)}
#invh span:first-child{font-weight:bold;color:#fff}
#invc{flex:1;text-align:right}
#sheetx{min-width:36px;min-height:36px;padding:2px 8px;background:rgba(255,255,255,.1);color:#fff}
#inv{max-width:none}
#inv button{background:rgba(255,255,255,.08);color:#f1efe6}
#inv .cnt{color:rgba(255,255,255,.65)}#inv kbd{color:rgba(255,255,255,.5)}
#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:3;width:auto;max-width:min(560px,calc(100% - 16px));min-height:0;justify-content:center;background:rgba(14,20,14,.82);color:#d4dccd;font-size:13px;padding:6px 12px;border-radius:10px;pointer-events:none;backdrop-filter:blur(4px)}
#info:empty{display:none}
#info b{color:#fff!important}
#info button{pointer-events:auto;background:rgba(255,255,255,.14);color:#fff;min-height:44px}
#drop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 48px);left:50%;transform:translateX(-50%);z-index:3;width:auto;min-height:0;max-width:calc(100% - 16px);background:rgba(14,20,14,.82);padding:5px 12px;border-radius:999px;pointer-events:none;font-size:14px;color:#d4dccd}
#drop:empty{display:none}
#tree{position:fixed;inset:0;border-radius:0;z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
#over{position:fixed;inset:0;border-radius:0;z-index:12}
#rot{display:none;position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);z-index:2;width:max-content;max-width:calc(100% - 24px);text-align:center;background:rgba(14,20,14,.82);color:#ffe9a0;font-size:13px;padding:6px 12px;border-radius:10px;pointer-events:none;animation:rotfade 7s forwards}
@keyframes rotfade{0%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(pointer:coarse){body.portrait #rot{display:block}}
#inv img.ic{width:46px;height:46px;display:block;margin:-2px 0}
#inv button{min-height:80px}
#inv{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="768" height="480"></canvas></div>
<div id="top"><span>💰 <b id="gold"></b></span><span>❤️ <b id="lives"></b></span><span>Волна <b id="wave"></b></span></div>
<div id="tr"></div>
<div id="drop"></div>
<div id="info"></div>
<div id="tools"></div>
<div id="sheet"><div id="invh"><span>Инвентарь</span><span id="invc"></span><button id="sheetx" aria-label="Закрыть">✕</button></div><div id="inv"></div></div>
<div id="bar"></div>
<div id="rot">Поверни телефон горизонтально — карта займёт весь экран</div>
<div id="tree"></div>
<div id="over"><div id="overT"></div><button class="go" id="restart">Играть снова</button></div>
<script>
// ===== КОНФИГ — сюда добавляем новые идеи =====
const CELL=48, COLS=16, ROWS=10;
const PATH=[[0,2],[5,2],[5,7],[10,7],[10,3],[15,3]]; // клетки маршрута
const TOWERS={
  arrow:{name:'Стрелок',rarity:'common',cost:50,range:130,dmg:10,rate:2.5,color:'#d9a441',speed:420},
  cannon:{name:'Пушка',rarity:'rare',cost:90,range:110,dmg:30,rate:0.8,color:'#8a5a44',speed:280,splash:50},
  frost:{name:'Мороз',rarity:'common',cost:70,range:100,dmg:4,rate:1.5,color:'#5fb4d9',speed:360,slow:0.5,slowTime:1.5},
  sniper:{name:'Снайпер',rarity:'epic',cost:150,range:280,dmg:90,rate:0.6,color:'#a35fd9',speed:900},
  dragon:{name:'Дракон',rarity:'legendary',cost:400,range:200,dmg:300,rate:2,color:'#ff5a2a',speed:500,splash:90}
};
const ENEMIES={
  basic:{hp:30,speed:60,reward:5,color:'#c0504d',r:11},
  fast:{hp:18,speed:105,reward:4,color:'#e08a3c',r:8},
  tank:{hp:120,speed:38,reward:14,color:'#6a4a8a',r:14}
};
function waveList(n){ // состав волны n — главное место для балансировки
  const l=[];
  for(let i=0;i<5+n*2;i++)l.push('basic');
  if(n>=3)for(let i=0;i<n;i++)l.push('fast');
  if(n>=5)for(let i=0;i<Math.floor(n/2);i++)l.push('tank');
  return l.sort(()=>Math.random()-.5);
}
const hpScale=n=>1+(n-1)*0.18;
// ===== ДРЕВО ЗНАНИЙ: очки за волны, сохраняются после проигрыша =====
const KN={have:{}};
const TREE_COST=60; // цена узла = c × TREE_COST золота
const has=id=>!!KN.have[id];
const dmgMul=()=>1+(has('atk1')?.1:0)+(has('atk4')?.2:0);
const rMul=()=>has('atk3')?1.15:1;
const BRANCH=['Экономика','Атака','Защита'];
const TREE=[ // br — ветка, c — цена, p — требуемый узел
  {id:'eco1',br:0,name:'Трофеи',d:'+25% золота за врагов',c:1,p:null},
  {id:'eco2',br:0,name:'Казна',d:'+50% золота за волну',c:2,p:'eco1'},
  {id:'eco3',br:0,name:'Удача',d:'+30% к шансу дропа башен',c:3,p:'eco2'},
  {id:'atk1',br:1,name:'Заточка',d:'+10% урона',c:1,p:null},
  {id:'atk2',br:1,name:'Скорострельность',d:'+10% скорости стрельбы',c:2,p:'atk1'},
  {id:'atk3',br:1,name:'Меткость',d:'+15% дальности',c:2,p:'atk1'},
  {id:'atk4',br:1,name:'Мастерство',d:'+20% урона',c:4,p:'atk3'},
  {id:'def1',br:2,name:'Крепость',d:'+5 жизней',c:1,p:null},
  {id:'def2',br:2,name:'Болото',d:'враги на 10% медленнее',c:2,p:'def1'},
  {id:'def3',br:2,name:'Припасы',d:'+50 стартового золота',c:2,p:'def2'}
];
function buyNode(id){
  const n=TREE.find(x=>x.id===id);
  if(has(id)||S.gold<n.c*TREE_COST||(n.p&&!has(n.p)))return;
  S.gold-=n.c*TREE_COST;KN.have[id]=true;
  if(id==='def1')S.lives+=5;
  if(id==='def3')S.gold+=50;
  renderTree();
  ui();
}
function toggleTree(){const el=$('tree');el.style.display=el.style.display==='block'?'none':'block';if(el.style.display==='block')renderTree();ui()}
function refreshTree(){
  const g=$('tgold');if(g)g.textContent=S.gold;
  document.querySelectorAll('#tree .node').forEach(b=>{const n=TREE.find(x=>x.id===b.dataset.id);b.disabled=has(n.id)||!!(n.p&&!has(n.p))||S.gold<n.c*TREE_COST});
}
function renderTree(){
  const el=$('tree');el.textContent='';
  const h=document.createElement('div');h.className='th';
  h.innerHTML=`<b>Древо знаний</b><span>Золото: <b id="tgold">${S.gold}</b> 💰</span>`;
  const cb=document.createElement('button');cb.textContent='Закрыть';cb.onclick=toggleTree;h.append(cb);el.append(h);
  const cols=document.createElement('div');cols.className='tc';
  BRANCH.forEach((bn,bi)=>{
    const col=document.createElement('div');col.innerHTML=`<b>${bn}</b>`;
    TREE.filter(n=>n.br===bi).forEach(n=>{
      const b=document.createElement('button'),owned=has(n.id),open=!n.p||has(n.p);
      b.className='node'+(owned?' own':'');b.dataset.id=n.id;b.disabled=owned||!open||S.gold<n.c*TREE_COST;
      b.innerHTML=`<b>${n.name}</b><br><small>${n.d}</small><br><small>${owned?'изучено':open?'цена: '+n.c*TREE_COST+' 💰':'нужно: '+TREE.find(x=>x.id===n.p).name}</small>`;
      b.onclick=()=>buyNode(n.id);col.append(b);
    });
    cols.append(col);
  });
  el.append(cols);
}
// ===== ГАЧА: башни выбиваются, а не покупаются =====
const ROAD_CHANCE=0.35; // шанс дропа одной клетки дороги за КАЖДЫЙ старт (как у башен)
const DROP_CHANCE=0.35; // шанс дропа башни за КАЖДЫЙ старт в конце волны
const RARITY={common:{n:'Обычная',c:'#8d968b'},rare:{n:'Редкая',c:'#4a90d9'},epic:{n:'Эпическая',c:'#a35fd9'},legendary:{n:'Легендарная',c:'#f2a31b'}};
const ODDS=[['legendary',1e-6],['epic',1e-3],['rare',0.08]]; // шансы за одну крутку; остальное — обычные
function pull(){
  const r=Math.random();let acc=0,rar='common';
  for(const [k,p] of ODDS){acc+=p;if(r<acc){rar=k;break}}
  const pool=Object.keys(TOWERS).filter(k=>TOWERS[k].rarity===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}

// ===== СОСТОЯНИЕ =====
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let S;
const FOUND={}; // башни, которые игрок уже выбивал: остальные в инвентаре скрыты
const pathCells=new Set(); let paths=[], pathsOk=false, starts=[], end=null;
const MAPT={start:'Кликни по клетке — здесь появятся враги. Стартов может быть несколько, повторный клик убирает старт.',end:'Кликни по клетке — враги идут сюда.',road:'Рисуй дорогу: кликай или веди мышью. Дорога должна соединять старт и финиш. Каждая клетка тратит дорогу из инвентаря, стёртая клетка возвращается.',erase:'Стирает башню (вернётся в инвентарь, поработает и во время волны) или дорогу. Старт и финиш стираются вместе с клеткой.'};
function defaultMap(){
  pathCells.clear();
  for(let i=0;i<PATH.length-1;i++){
    let [x,y]=PATH[i];const [tx,ty]=PATH[i+1];
    while(true){pathCells.add(x+','+y);if(x===tx&&y===ty)break;x+=Math.sign(tx-x);y+=Math.sign(ty-y)}
  }
  starts=[PATH[0].slice()];end=PATH[PATH.length-1].slice();recompute();
}
// поиск кратчайшего пути от старта к финишу по клеткам дороги (BFS)
function recompute(){
  dirty=true;paths=[];pathsOk=false;if(!starts.length||!end)return;
  const key=(x,y)=>x+','+y,prev=new Map([[key(end[0],end[1]),null]]),q=[end];
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[0,1],[-1,0],[0,-1]]){
      const nx=x+dx,ny=y+dy,k=key(nx,ny);
      if(pathCells.has(k)&&!prev.has(k)){prev.set(k,[x,y]);q.push([nx,ny])}
    }
  }
  for(const s of starts){
    if(!prev.has(key(s[0],s[1])))continue;
    let c=s;const r=[];
    while(c){r.push({x:c[0]*CELL+CELL/2,y:c[1]*CELL+CELL/2});c=prev.get(key(c[0],c[1]))}
    paths.push(r);
  }
  pathsOk=paths.length===starts.length;
}
function applyTool(cx,cy){
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return;
  if(S.build==='erase'){const t=S.towers.find(t=>t.cx===cx&&t.cy===cy);if(t){S.gold+=Math.floor(t.spent*.7);S.inv[t.type]=(S.inv[t.type]||0)+1;S.towers=S.towers.filter(x=>x!==t);if(S.sel===t)S.sel=null;ui();return}}
  if(S.waving)return;
  if(S.towers.some(t=>t.cx===cx&&t.cy===cy))return;
  const k=cx+','+cy,m=S.build;
  if(m==='road'){if(pathCells.has(k)||S.roads<1)return;pathCells.add(k);S.roads--;if(S.roads<1){S.build=null;painting=false}}
  else if(m==='start'){if(end&&k===end.join(','))return;const i=starts.findIndex(s=>s[0]===cx&&s[1]===cy);if(i>=0)starts.splice(i,1);else{pathCells.add(k);starts.push([cx,cy])}}
  else if(m==='end'){if(starts.some(s=>s[0]===cx&&s[1]===cy))return;pathCells.add(k);end=[cx,cy]}
  else if(m==='erase'){const isEnd=end&&k===end.join(','),i=starts.findIndex(s=>s[0]===cx&&s[1]===cy);if(isEnd)end=null;if(i>=0)starts.splice(i,1);if(pathCells.has(k)&&!isEnd&&i<0){S.roads++;FOUND.road=1}pathCells.delete(k)}
  recompute();ui();
}
function reset(){

function update(dt){
  if(S.banner)S.banner.t+=dt;
  for(const n of S.notes)n.t+=dt;S.notes=S.notes.filter(n=>n.t<3.5);
  S.flash=Math.max(0,S.flash-dt);for(const f of S.fx){f.t+=dt;f.x+=(f.vx||0)*dt;f.y+=(f.vy||0)*dt;if(f.k==='p'){f.vx*=.96;f.vy*=.96}}S.fx=S.fx.filter(f=>f.t<f.life);
  if(S.over)return;
  if(S.queue.length){S.spawnT-=dt;if(S.spawnT<=0){spawn(S.queue.pop());S.spawnT=Math.max(.35,.9-S.wave*.03)}}
  for(const e of S.enemies){
    const d=ENEMIES[e.type],ox=e.x,oy=e.y;e.slow=Math.max(0,e.slow-dt);e.hit=Math.max(0,(e.hit||0)-dt);
    let mv=d.speed*(has('def2')?.9:1)*(e.slow>0?e.slowF:1)*dt;
    while(mv>0&&e.wp<e.pts.length){
      const p=e.pts[e.wp],dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);
      if(dist<=mv){e.x=p.x;e.y=p.y;e.wp++;mv-=dist}
      else{e.x+=dx/dist*mv;e.y+=dy/dist*mv;mv=0}
    }
    if(e.x!==ox||e.y!==oy)e.a=Math.atan2(e.y-oy,e.x-ox);
    if(e.wp>=e.pts.length){e.dead=true;S.lives--;S.flash=.6;hurtHud();burst(e.x,e.y,'#e45a4a',8,90,.5);if(S.lives<=0)gameOver(false)}
  }
  for(const t of S.towers){
    t.cd-=dt;t.rec=Math.max(0,(t.rec||0)-dt*22);if(t.cd>0)continue;
    const d=TOWERS[t.type];let best=null,bp=-1;
    for(const e of S.enemies){if(e.dead)continue;
      if(Math.hypot(e.x-t.x,e.y-t.y)<=t.range*rMul()){const pr=e.wp*1e4-Math.hypot(e.pts[Math.min(e.wp,e.pts.length-1)].x-e.x,e.pts[Math.min(e.wp,e.pts.length-1)].y-e.y);if(pr>bp){bp=pr;best=e}}}

    if(dist<=step){hit(s,d);s.gone=true}else{s.x+=dx/dist*step;s.y+=dy/dist*step}
  }
  S.shots=S.shots.filter(s=>!s.gone);
  for(const e of S.enemies)if(!e.dead&&e.hp<=0){e.dead=true;const g=Math.round(ENEMIES[e.type].reward*(has('eco1')?1.25:1));S.gold+=g;burst(e.x,e.y,ENEMIES[e.type].color,10,100,.55);addFx({k:'ring',x:e.x,y:e.y,r:ENEMIES[e.type].r*2.4,life:.3,c:'#fff'});addFx({k:'txt',x:e.x,y:e.y-14,txt:'+'+g,c:'#ffd24a',life:.8,vy:-26});ui()}

    ui();
  }

  const tx=s.target.x,ty=s.target.y;

  for(const [x,y] of P){
    g.fillStyle=`hsl(36,${30+hs(x,y,4)*8}%,${52+hs(x,y,2)*7}%)`;g.fillRect(x*CELL,y*CELL,CELL+.5,CELL+.5);
    for(let i=0;i<5;i++){g.fillStyle=i%2?'rgba(255,240,200,.28)':'rgba(70,50,25,.25)';g.beginPath();g.ellipse(x*CELL+hs(x,y,40+i)*44+2,y*CELL+hs(x,y,50+i)*44+2,2+hs(x,y,60+i)*2,1.5,0,0,7);g.fill()}
  }
  for(const [x,y] of P)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    if(pathCells.has((x+dx)+','+(y+dy)))continue;
    for(let i=0;i<7;i++){
      const u=hs(x*4+dx,y*4+dy,70+i)*CELL,ex=dx?(dx>0?x*CELL+CELL+3:x*CELL-3):x*CELL+u,ey=dy?(dy>0?y*CELL+CELL+3:y*CELL-3):y*CELL+u;
      g.strokeStyle=i%2?'#4f8a3a':'#2f5f2a';g.lineWidth=1.6;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex+dx*4+(hs(x,y,80+i)-.5)*4,ey+dy*4+(hs(x,y,90+i)-.5)*4-3);g.stroke();
      if(i===3)dot(g,ex+dx*3,ey+dy*3,2.2,'#9a8f78');
    }
  }
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    if(pathCells.has(x+','+y)||!(x===0||y===0||x===COLS-1||y===ROWS-1)||hs(x,y,100)>.55)continue;
    pine(g,x*CELL+CELL/2+(hs(x,y,101)-.5)*14,y*CELL+CELL*(y===0?.55:.7)+(hs(x,y,102)-.5)*8,.8+hs(x,y,103)*.4);
  }
  return c;
}

function portal(p){
  if(!p)return;const x=p[0]*CELL+24,y=p[1]*CELL+24;
  const g=ctx.createRadialGradient(x,y,2,x,y,26);g.addColorStop(0,'rgba(120,255,170,.6)');g.addColorStop(1,'rgba(60,200,110,0)');ctx.fillStyle=g;ctx.fillRect(x-28,y-28,56,56);
  ctx.lineWidth=3;for(let i=0;i<3;i++){ctx.strokeStyle=`rgba(110,240,160,${.95-i*.25})`;ctx.beginPath();ctx.ellipse(x,y,17-i*5+Math.sin(T*3+i)*1.5,17-i*5,T*(i%2?1.6:-1.6),0,Math.PI*1.6);ctx.stroke()}
  for(let i=0;i<4;i++){const q=T*2+i*1.57;dot(ctx,x+Math.cos(q)*21,y+Math.sin(q)*21,1.8,'rgba(200,255,220,.9)')}
}
function castle(p){
  if(!p)return;const x=p[0]*CELL,y=p[1]*CELL;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+24,y+43,27,7,0,0,7);ctx.fill();
  const tw=(tx,h)=>{ctx.fillStyle='#8f959c';ctx.fillRect(tx,y+h,10,44-h);ctx.fillStyle='#adb2b9';ctx.fillRect(tx,y+h,4,44-h);ctx.fillStyle='#b8473a';ctx.beginPath();ctx.moveTo(tx-2,y+h);ctx.lineTo(tx+5,y+h-12);ctx.lineTo(tx+12,y+h);ctx.fill();dot(ctx,tx+5,y+h+9,1.8,'#ffd86a')};
  tw(x-2,12);tw(x+40,12);
  ctx.fillStyle='#a3a8ae';ctx.fillRect(x+6,y+18,36,26);ctx.fillStyle='#82888f';ctx.fillRect(x+34,y+18,8,26);
  ctx.fillStyle='#b4b9bf';for(let i=0;i<4;i++)ctx.fillRect(x+6+i*10,y+12,6,7);
  ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(x+6,y+26+i*6);ctx.lineTo(x+42,y+26+i*6);ctx.stroke()}
  ctx.fillStyle='#3a2a1c';rr(ctx,x+18,y+28,12,16,6);ctx.fill();ctx.fillRect(x+18,y+36,12,8);
  ctx.globalAlpha=.45+.3*Math.sin(T*4);dot(ctx,x+24,y+38,3.5,'#ffcf66');ctx.globalAlpha=1;
  ctx.strokeStyle='#4a3a2a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+24,y+12);ctx.lineTo(x+24,y-4);ctx.stroke();
  ctx.fillStyle='#d24a3a';ctx.beginPath();ctx.moveTo(x+24,y-4);ctx.lineTo(x+37+Math.sin(T*5)*2,y);ctx.lineTo(x+24,y+5);ctx.fill();
}

function drawTower(k,x,y,a,rec,lvl){
  const d=TOWERS[k],rc=RARITY[d.rarity].c;
  if(d.rarity==='legendary'||d.rarity==='epic'){const g=ctx.createRadialGradient(x,y,6,x,y,34+Math.sin(T*3)*3);g.addColorStop(0,rc+'88');g.addColorStop(1,rc+'00');ctx.fillStyle=g;ctx.fillRect(x-40,y-40,80,80)}
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+2,y+15,19,7,0,0,7);ctx.fill();
  const b=ctx.createRadialGradient(x-6,y-6,2,x,y,21);b.addColorStop(0,'#c4c1b2');b.addColorStop(1,'#6a685e');
  ctx.fillStyle=b;ctx.beginPath();ctx.arc(x,y,19,0,7);ctx.fill();ctx.strokeStyle=rc;ctx.lineWidth=2.5;ctx.stroke();
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.translate(-rec,0);ctx.lineCap='round';
  if(k==='arrow'){
    dot(ctx,0,0,10,'#8a5a2b');dot(ctx,-1,-1,6,'#a8723a');
    ctx.strokeStyle='#f0d080';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-3,0,13,-1.15,1.15);ctx.stroke();
    ctx.strokeStyle='#eee';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-3+13*Math.cos(1.15),13*Math.sin(1.15));ctx.lineTo(-6,0);ctx.lineTo(-3+13*Math.cos(1.15),-13*Math.sin(1.15));ctx.stroke();
    ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(14,0);ctx.stroke();
    ctx.fillStyle='#ccc';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(13,-3);ctx.lineTo(13,3);ctx.fill();
  }else if(k==='cannon'){
    dot(ctx,-2,0,11,'#6b4332');ctx.fillStyle='#2e2522';rr(ctx,-4,-6,22,12,3);ctx.fill();ctx.fillStyle='#4a3c38';rr(ctx,13,-7.5,6,15,2);ctx.fill();dot(ctx,-3,-3,4,'#9a6a50');
  }else if(k==='frost'){
    ctx.rotate(T*.8-a);
    const g=ctx.createRadialGradient(0,0,2,0,0,20);g.addColorStop(0,'rgba(190,240,255,.9)');g.addColorStop(1,'rgba(95,180,217,0)');ctx.fillStyle=g;ctx.fillRect(-20,-20,40,40);
    ctx.fillStyle='#7fd0f0';for(let i=0;i<6;i++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(3,-12);ctx.lineTo(0,-17);ctx.lineTo(-3,-12);ctx.fill()}
    dot(ctx,0,0,5,'#eaffff');
  }else if(k==='sniper'){
    dot(ctx,-2,0,10,'#7a3fb0');ctx.fillStyle='#2b2238';rr(ctx,-2,-2.5,32,5,2);ctx.fill();ctx.fillStyle='#4a3c60';rr(ctx,2,-8,10,5,2);ctx.fill();dot(ctx,12,-5.5,2.2,'#d9b3ff');dot(ctx,-4,-3,4,'#b27ae6');
  }else{
    ctx.fillStyle='#b83a14';for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(-2,s*6);ctx.lineTo(-14,s*(16+Math.sin(T*6)*3));ctx.lineTo(-6,s*3);ctx.fill()}
    dot(ctx,-1,0,11,'#e0481a');dot(ctx,-3,-3,6,'#ff7a3a');
    ctx.fillStyle='#e0481a';ctx.beginPath();ctx.ellipse(11,0,8,6,0,0,7);ctx.fill();
    ctx.fillStyle='#ffd24a';for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(8,s*5);ctx.lineTo(4,s*11);ctx.lineTo(12,s*6);ctx.fill()}
    dot(ctx,12,-2.5,1.8,'#ffe97a');dot(ctx,12,2.5,1.8,'#ffe97a');
    const f=ctx.createRadialGradient(19,0,0,19,0,9+Math.sin(T*14)*2);f.addColorStop(0,'rgba(255,230,120,.9)');f.addColorStop(1,'rgba(255,90,30,0)');ctx.fillStyle=f;ctx.fillRect(8,-12,24,24);
  }
  ctx.restore();
  for(let i=0;i<lvl;i++)dot(ctx,x-(lvl-1)*4+i*8,y+19,2.6,'#ffd24a');
}

function drawEnemy(e){
  const d=ENEMIES[e.type],r=d.r,a=e.a||0,y=e.y+Math.sin(T*10+e.x*.05)*1.5,
    col=e.hit>0?'#fff':e.slow>0?'#8fd0ea':d.color;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(e.x,e.y+r*.85,r,r*.4,0,0,7);ctx.fill();
  ctx.save();ctx.translate(e.x,y);ctx.fillStyle=col;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=2;
  if(e.type==='fast'){
    ctx.rotate(a);ctx.beginPath();ctx.moveTo(r+5,0);ctx.lineTo(-r,-r);ctx.lineTo(-r*.4,0);ctx.lineTo(-r,r);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(-r-3,-3);ctx.lineTo(-r-11,-3);ctx.moveTo(-r-3,3);ctx.lineTo(-r-9,3);ctx.stroke();ctx.rotate(-a);
  }else{
    const sq=Math.sin(T*8+e.x*.1)*.07;ctx.beginPath();ctx.ellipse(0,0,r*(1+sq),r*(1-sq),0,0,7);ctx.fill();ctx.stroke();
    if(e.type==='tank'){ctx.fillStyle=e.hit>0?'#fff':'#4a3468';ctx.beginPath();ctx.arc(0,0,r,Math.PI,0);ctx.fill();ctx.stroke();for(const s of[-7,0,7])dot(ctx,s,-r*.55,1.5,'#cbb8e8')}
  }
  const ex=Math.cos(a)*2.5,ey=Math.sin(a)*2;
  for(const s of[-1,1]){dot(ctx,ex+s*3.5,ey-1,e.type==='fast'?2:3,'#fff');dot(ctx,ex+s*3.5+Math.cos(a)*1.2,ey-1+Math.sin(a)*1.2,1.4,'#111')}
  ctx.restore();
  const p=Math.max(0,e.hp/e.max);
  if(p<1){const w=26,by=e.y-r-10;ctx.fillStyle='rgba(0,0,0,.6)';rr(ctx,e.x-w/2-1,by-1,w+2,6,3);ctx.fill();ctx.fillStyle=p>.5?'#6fd36f':p>.25?'#e8c040':'#e45a4a';rr(ctx,e.x-w/2,by,Math.max(2,w*p),4,2);ctx.fill()}
  if(e.slow>0)for(let i=0;i<3;i++){const q=T*3+i*2.1;dot(ctx,e.x+Math.cos(q)*(r+3),e.y+Math.sin(q)*(r+3),1.8,'#e6fbff')}
}

function draw(){
  T=performance.now()/1000;
  if(dirty){terrain=buildTerrain();dirty=false}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(terrain,0,0,W,H);
  starts.forEach(s=>portal(s));castle(end);
  for(const e of S.enemies)drawEnemy(e);
  for(const t of S.towers){
    const p=Math.min(1,(T-(t.born||0))/.3),sc=p<1?1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2):1;
    if(sc!==1){ctx.save();ctx.translate(t.x,t.y);ctx.scale(sc,sc);ctx.translate(-t.x,-t.y)}
    drawTower(t.type,t.x,t.y,t.a||0,t.rec||0,t.lvl);
    if(sc!==1)ctx.restore();
    if(S.sel===t){ctx.strokeStyle=`rgba(255,255,255,${.6+.3*Math.sin(T*6)})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(t.x,t.y,24+Math.sin(T*6),0,7);ctx.stroke()}
  }
  for(const s of S.shots){
    const k=s.t.type,a=Math.atan2(s.target.y-s.y,s.target.x-s.x),c=TOWERS[k].color;
    (s.tr||[]).forEach((p,i,A)=>dot(ctx,p.x,p.y,k==='arrow'||k==='sniper'?1.2:1+i*.5,c+Math.round(i/A.length*90+10).toString(16).padStart(2,'0')));
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(a);ctx.lineCap='round';
    if(k==='arrow'){ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(6,0);ctx.stroke();ctx.fillStyle='#ddd';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(5,-3);ctx.lineTo(5,3);ctx.fill()}
    else if(k==='sniper'){ctx.strokeStyle='#e3c8ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(6,0);ctx.stroke()}
    else if(k==='dragon'){const g=ctx.createRadialGradient(0,0,1,0,0,12);g.addColorStop(0,'#fff6b0');g.addColorStop(.4,'#ff8a2a');g.addColorStop(1,'rgba(255,60,20,0)');ctx.fillStyle=g;ctx.fillRect(-14,-14,28,28)}
    else if(k==='frost'){dot(ctx,0,0,5,'rgba(120,210,245,.35)');dot(ctx,0,0,3,'#e6fbff')}
    else{dot(ctx,0,0,5,'#2b2320');dot(ctx,-1.5,-1.5,1.8,'#777')}
    ctx.restore();
  }
  for(const f of S.fx){
    const u=f.t/f.life;
    if(f.k==='p'){ctx.globalAlpha=1-u;dot(ctx,f.x,f.y,f.s*(1-u*.5),f.c)}
    else if(f.k==='ring'){ctx.globalAlpha=(1-u)*.8;ctx.strokeStyle=f.c;ctx.lineWidth=3*(1-u)+1;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.3+.7*u),0,7);ctx.stroke();ctx.fillStyle=f.c;ctx.globalAlpha=(1-u)*.18;ctx.fill()}
    else{ctx.globalAlpha=1-u*u;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y)}
    ctx.globalAlpha=1;
  }
  if(S.build&&TOWERS[S.build])for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){
    if(pathCells.has(x+','+y)||S.towers.some(t=>t.cx===x&&t.cy===y))continue;
    ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;rr(ctx,x*CELL+5,y*CELL+5,CELL-10,CELL-10,8);ctx.stroke();
  }
  const h=S.hover;
  if(h&&S.build&&TOWERS[S.build]&&h.cx>=0&&h.cy>=0&&h.cx<COLS&&h.cy<ROWS){
    const ok=!pathCells.has(h.cx+','+h.cy)&&!S.towers.some(t=>t.cx===h.cx&&t.cy===h.cy),hx=h.cx*CELL+CELL/2,hy=h.cy*CELL+CELL/2;
    ctx.fillStyle=ok?'rgba(255,255,255,.22)':'rgba(220,60,40,.4)';rr(ctx,h.cx*CELL+2,h.cy*CELL+2,CELL-4,CELL-4,8);ctx.fill();
    if(ok){ctx.globalAlpha=.6;drawTower(S.build,hx,hy,0,0,0);ctx.globalAlpha=1}
    ring(hx,hy,TOWERS[S.build].range*rMul());
  }
  if(h&&MAPT[S.build]){ctx.fillStyle='rgba(255,255,255,.3)';rr(ctx,h.cx*CELL+2,h.cy*CELL+2,CELL-4,CELL-4,8);ctx.fill()}
  if(S.sel)ring(S.sel.x,S.sel.y,S.sel.range*rMul());
  for(let i=0;i<14;i++){const x=(hs(i,1)*W+Math.sin(T*.3+i)*30+W)%W,y=(hs(i,2)*H+Math.cos(T*.4+i*2)*20+H)%H;dot(ctx,x,y,1.8,`rgba(230,255,150,${.25+.25*Math.sin(T*2+i)})`)}
  for(let i=0;i<3;i++){const cx=((T*14+i*330)%(W+300))-150,cy=90+i*150+Math.sin(T*.2+i)*20,g=ctx.createRadialGradient(cx,cy,10,cx,cy,110);g.addColorStop(0,'rgba(0,20,0,.13)');g.addColorStop(1,'rgba(0,20,0,0)');ctx.fillStyle=g;ctx.fillRect(cx-120,cy-120,240,240)}
  if(!vig){vig=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,W*.62);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.38)')}
  ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
  if(S.flash>0){ctx.fillStyle=`rgba(200,30,20,${S.flash*.35})`;ctx.fillRect(0,0,W,H)}
  for(const n of S.notes){
    const t=TOWERS[n.k],r=RARITY[t.rarity],txt='+ '+t.name;
    ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(txt).width+40,x=Math.max(w/2+2,Math.min(W-w/2-2,n.x)),y=Math.max(16,n.y-16-n.t*12);
    ctx.globalAlpha=Math.max(0,Math.min(1,(3.5-n.t)/.8));
    ctx.fillStyle='rgba(20,24,20,.88)';rr(ctx,x-w/2,y-12,w,24,8);ctx.fill();
    ctx.strokeStyle=r.c;ctx.lineWidth=2;ctx.stroke();
    ctx.drawImage(iconCanvas(n.k),x-w/2+4,y-11,22,22);ctx.fillStyle=r.c;ctx.fillText(txt,x+12,y+1);
    ctx.globalAlpha=1;
  }
  const bn=S.banner;
  if(bn&&bn.t<2){
    const u=bn.t/2,a=u<.15?u/.15:u>.7?(1-u)/.3:1,sl=1-Math.pow(1-Math.min(1,bn.t/.4),3),gr=ctx.createLinearGradient(0,0,W,0);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.25,'rgba(10,14,10,.75)');gr.addColorStop(.75,'rgba(10,14,10,.75)');gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.globalAlpha=a*.9;ctx.fillStyle=gr;ctx.fillRect(0,H/2-34,W,68);
    ctx.globalAlpha=a;ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.7)';
    const bx=W/2-(1-sl)*120;ctx.strokeText(bn.txt,bx,H/2);ctx.fillStyle='#ffe9a0';ctx.fillText(bn.txt,bx,H/2);ctx.globalAlpha=1;
  }
  if(S.paused){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);ctx.font='bold 44px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText('⏸ Пауза',W/2,H/2)}
}
function ring(x,y,r){ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.5;ctx.setLineDash([6,5]);ctx.lineDashOffset=-T*12;ctx.stroke();ctx.setLineDash([])}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!S.paused)for(let i=0;i<S.speed;i++)update(dt);
  draw();requestAnimationFrame(loop);
}
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px';document.body.classList.toggle('portrait',innerHeight>innerWidth)}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();
defaultMap();reset();requestAnimationFrame(loop);
</script>
</body>
